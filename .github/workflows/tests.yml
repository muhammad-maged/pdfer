name: Tests
on:
  push:
  pull_request:
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, dom, curl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
